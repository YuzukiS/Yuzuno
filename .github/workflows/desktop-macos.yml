# Builds the macOS desktop app (T-165) with scripts/desktop-macos.sh on
# standard GitHub-hosted runners, for Apple silicon (arm64) only: Intel Macs
# are not supported (YN-161). Each runs the desktop tests and checks what it
# packed:
# - A pull request that changes desktop/, the script or this workflow builds
#   and tests it. Nothing is uploaded; the checksums, build.json and where
#   the window's buttons stand are in the run's log and summary.
# - Run on request (workflow_dispatch) for the current head of main, after
#   the CI workflow has passed on that commit's push to main, it is a
#   candidate: the disk image, the app as a ZIP, its update package, build.json
#   and SHA256SUMS, with a picture of its window and where its buttons stand,
#   one artifact kept 14 days. Never a Release. Its optional version input
#   (X.Y.Z) is the version built into the app; without it, the source's.
# - Run on request with lab (not with a version), from main with passed CI as
#   a candidate, it builds the update lab's Yuzuno Lab 0.0.1, 0.0.2 and 0.0.3
#   (desktop/tauri.lab.conf.json) instead. It makes a lab key for this run
#   only, in the runner's temporary folder, signs each version's update
#   package with it and deletes the private key before anything is uploaded.
#   Two artifacts, kept 14 days: 0.0.1's disk image to install, and the feed
#   (the three signed update packages, the lab public key and build.json).
#   The regular app trusts only the committed key, never a lab key.
#
# Every build embeds the committed update public key, desktop/desktop-update.pub,
# and packs the update package Yuzuno.app.tar.gz. The package is not signed
# here: no private key is in this workflow; the release machine signs it
# (scripts/desktop.ps1). The app is signed ad hoc and not notarized: there is
# no Developer ID, and this workflow uses no secret. See desktop/README.md.
name: Desktop macOS

on:
  pull_request:
    branches: [main]
    paths:
      - desktop/**
      - scripts/desktop-macos.sh
      - .github/workflows/desktop-macos.yml
      - .github/scripts/hosted-guard.sh
      - .github/scripts/disk-precheck.sh
      - .github/scripts/macos-title-bar.sh
  workflow_dispatch:
    inputs:
      version:
        description: The version built into the app, X.Y.Z (empty for the source's)
        required: false
        type: string
        default: ''
      lab:
        description: Build the update lab's Yuzuno Lab 0.0.1-0.0.3 with a lab key made in this run (not with a version)
        required: false
        type: boolean
        default: false

# Read-only: actions: read only to look up the CI run of a candidate's commit.
permissions:
  contents: read
  actions: read

# A newer push to a PR cancels its older run; a started candidate finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The CI workflow's Rust; bump them together.
  RUST_TOOLCHAIN: 1.97.1

jobs:
  app:
    name: macOS app (${{ matrix.arch }})
    # The standard macOS 26 runner, free for public repositories: Apple
    # silicon (macos-26). Not a paid -large or -xlarge one, nor a
    # self-hosted one. Intel Macs are not supported (YN-161); there is no
    # universal app.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      # Before anything else, refuse any runner but a GitHub-hosted one.
      - name: GitHub-hosted runner
        working-directory: .
        run: |
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::not a GitHub-hosted runner"; exit 1; }

      # A candidate is only main, and only a commit whose push CI has passed.
      # The build is of github.sha: the head of main when the run was requested.
      - name: Main, with passed CI (candidate only)
        if: github.event_name == 'workflow_dispatch'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::candidates are built from main only, not $GITHUB_REF"; exit 1; }
          passed=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f event=push -f branch=main -f status=success --jq '.total_count')
          [ "${passed:-0}" -ge 1 ] || { echo "::error::CI has not passed on the push of $GITHUB_SHA to main; wait for it, then run again"; exit 1; }
          echo "CI passed on $GITHUB_SHA"

      # A candidate's version input is X.Y.Z or empty, and a lab run takes
      # none: checked before checkout.
      - name: Version input (candidate only)
        if: github.event_name == 'workflow_dispatch'
        working-directory: .
        env:
          VERSION: ${{ inputs.version }}
          LAB: ${{ inputs.lab }}
        shell: bash
        run: |
          if [ -n "$VERSION" ] && ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::the version input must be X.Y.Z (digits only)"; exit 1
          fi
          if [ "$LAB" = true ] && [ -n "$VERSION" ]; then
            echo "::error::a lab run builds its own versions; leave the version input empty"; exit 1
          fi
          echo "version: ${VERSION:-the source's}, lab: $LAB"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Runner details
        run: .github/scripts/hosted-guard.sh

      # The label's architecture is the one built for: refuse any other.
      - name: Architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          [ "$(uname -m)" = "$ARCH" ] || { echo "::error::this runner is $(uname -m), not $ARCH"; exit 1; }

      # Read-only check of free disk before building; see the script.
      - name: Disk space precheck
        run: .github/scripts/disk-precheck.sh 6 "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

      # Only the pinned toolchain, in a RUSTUP_HOME of its own, as in CI: the
      # image's own stable Rust changes with image updates.
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          export RUSTUP_HOME="$RUNNER_TEMP/rustup"
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup toolchain list

      # The pinned Tauri CLI and the crates are fetched fresh; nothing is
      # cached. SOURCE_COMMIT, which build.json records, is the commit checked
      # out: for a PR, GitHub's merge of it into main. Every build embeds the
      # committed update public key; a candidate with a version input carries
      # that version.
      - name: Desktop tests, app, disk image and update package
        if: ${{ !inputs.lab }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          SOURCE_COMMIT=$(git rev-parse HEAD)
          export SOURCE_COMMIT
          set -- --toolchain "$RUST_TOOLCHAIN" --tools "$RUNNER_TEMP/tools" --out "$RUNNER_TEMP/out" --test \
            --update-public-key desktop/desktop-update.pub
          [ -z "$VERSION" ] || set -- "$@" --version "$VERSION"
          scripts/desktop-macos.sh "$@"

      # The window has no title bar row: the system's window buttons stand
      # over the toolbar, at its middle (YN-90). Opens the app just built and
      # reads where they are through the Accessibility API, which the runner
      # image grants to bash and osascript, with a picture of the window.
      # Written inside out/, so that a candidate's artifact keeps out/ as its
      # root and holds these in title-bar/.
      - name: Window buttons over the toolbar
        if: ${{ !inputs.lab }}
        run: .github/scripts/macos-title-bar.sh "$RUNNER_TEMP/out/Yuzuno.app" "$RUNNER_TEMP/out/title-bar"

      # What was packed: the executable is this architecture's only, and
      # the ZIP, the disk image (mounted read-only) and the update package
      # hold that same executable; the image also holds the Applications link
      # to drag to. The update package, unpacked with macOS's tar as the
      # updater unpacks it, holds Yuzuno.app alone, whose signature passes
      # codesign's strict check and which has no quarantine attribute. The
      # executable holds the committed update public key once, and a
      # candidate with a version input carries that version.
      - name: Package structure
        if: ${{ !inputs.lab }}
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ inputs.version }}
          UPDATE_PUBLIC_KEY: desktop/desktop-update.pub
        run: |
          check="$RUNNER_TEMP/check"
          mkdir -p "$check/zip" "$check/dmg" "$check/tar"
          ditto -x -k "$RUNNER_TEMP/out/Yuzuno.app.zip" "$check/zip"
          /usr/bin/tar -xzf "$RUNNER_TEMP/out/Yuzuno.app.tar.gz" -C "$check/tar"
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$check/dmg" "$RUNNER_TEMP"/out/*.dmg
          status=0
          /usr/bin/python3 - "$RUNNER_TEMP/out" "$check" <<'EOF' || status=$?
          import glob, hashlib, json, os, plistlib, subprocess, sys
          out, check = sys.argv[1:]
          arch, version = os.environ["ARCH"], os.environ["VERSION"]
          key = open(os.environ["UPDATE_PUBLIC_KEY"], "rb").read().strip()
          app = json.load(open(os.path.join(out, "build.json")))["app"]
          problems = []
          if app["architectures"] != [arch]:
              problems.append(f"the executable is {app['architectures']}, not [{arch}]")
          if not app["updatePublicKeyId"]:
              problems.append("build.json names no update public key")
          if version and app["version"] != version:
              problems.append(f"build.json's version is {app['version']}, not {version}")
          dmgs = glob.glob(os.path.join(out, "*.dmg"))
          if len(dmgs) != 1:
              problems.append(f"{len(dmgs)} disk images")
          for where in ("zip", "dmg", "tar"):
              bundle = os.path.join(check, where, "Yuzuno.app")
              info = plistlib.load(open(os.path.join(bundle, "Contents", "Info.plist"), "rb"))
              executable = os.path.join(bundle, "Contents", "MacOS", info["CFBundleExecutable"])
              data = open(executable, "rb").read()
              digest = hashlib.sha256(data).hexdigest()
              if digest != app["executableSha256"]:
                  problems.append(f"{where}: the executable is {digest}, not build.json's")
              if data.count(key) != 1:
                  problems.append(f"{where}: the executable holds the update public key {data.count(key)} times, not once")
              if version and info.get("CFBundleShortVersionString") != version:
                  problems.append(f"{where}: the app's version is {info.get('CFBundleShortVersionString')}, not {version}")
          listing = sorted(os.listdir(os.path.join(check, "dmg")))
          link = os.path.join(check, "dmg", "Applications")
          if "Yuzuno.app" not in listing or not os.path.islink(link) or os.readlink(link) != "/Applications":
              problems.append(f"the disk image holds {listing}")
          unpacked = sorted(os.listdir(os.path.join(check, "tar")))
          if unpacked != ["Yuzuno.app"]:
              problems.append(f"the update package holds {unpacked}, not Yuzuno.app alone")
          tar_app = os.path.join(check, "tar", "Yuzuno.app")
          signature = subprocess.run(["/usr/bin/codesign", "--verify", "--deep", "--strict", tar_app], capture_output=True, text=True)
          if signature.returncode != 0:
              problems.append(f"the unpacked update package fails codesign --verify: {(signature.stdout + signature.stderr).strip()}")
          attributes = subprocess.run(["/usr/bin/xattr", "-r", tar_app], capture_output=True, text=True, check=True).stdout
          if "com.apple.quarantine" in attributes:
              problems.append("the unpacked update package has a quarantine attribute")
          print(f"{arch}: {os.path.basename(dmgs[0]) if dmgs else '-'}, image {listing}, update package {unpacked}, "
                f"version {app['version']}, key {app['updatePublicKeyId']}, executable {app['executableSha256']}")
          print(f"extended attributes of the unpacked update package: {attributes.strip() or 'none'}")
          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
          EOF
          hdiutil detach "$check/dmg" || status=1
          exit "$status"

      - name: Checksums
        if: ${{ !inputs.lab }}
        run: |
          cd "$RUNNER_TEMP/out"
          shasum -a 256 *.dmg Yuzuno.app.zip Yuzuno.app.tar.gz build.json > SHA256SUMS
          cat SHA256SUMS build.json
          {
            echo "### macOS app (${{ matrix.arch }})"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
            echo
            echo '```json'
            cat build.json
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'workflow_dispatch' && !inputs.lab
        with:
          name: yuzuno-macos-${{ matrix.arch }}-${{ inputs.version || 'source' }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/out/*.dmg
            ${{ runner.temp }}/out/Yuzuno.app.zip
            ${{ runner.temp }}/out/Yuzuno.app.tar.gz
            ${{ runner.temp }}/out/build.json
            ${{ runner.temp }}/out/SHA256SUMS
            ${{ runner.temp }}/out/title-bar/title-bar.png
            ${{ runner.temp }}/out/title-bar/geometry.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # The update lab (lab only). The lab key is made here, in the runner's
      # temporary folder, without a password (--ci; signing then reads no
      # terminal and takes the empty one), and nothing prints it:
      # `signer generate -w` prints only the files' paths, and `signer sign`
      # only the signature. Each version is built with --lab, embedding the
      # lab public key; 0.0.1 also runs the desktop tests. Each update package
      # is staged under the name Core relays (feed/desktop-<version>/) and
      # signed for its version with the lab key, which is deleted at the end
      # of this step, also when it fails. The artifacts are written to their
      # own folders, apart from the key's.
      - name: Update lab builds, signed with a lab key (lab only)
        if: github.event_name == 'workflow_dispatch' && inputs.lab
        shell: bash
        run: |
          lab="$RUNNER_TEMP/lab" builds="$RUNNER_TEMP/lab-builds"
          feed="$RUNNER_TEMP/lab-feed" install="$RUNNER_TEMP/lab-install"
          mkdir "$lab" "$builds" "$feed" "$install" "$feed/feed" "$feed/builds"
          trap 'rm -f "$lab/lab.key"' EXIT
          SOURCE_COMMIT=$(git rev-parse HEAD)
          export SOURCE_COMMIT
          cli=$(scripts/desktop-macos.sh --toolchain "$RUST_TOOLCHAIN" --tools "$RUNNER_TEMP/tools" --install-cli | tail -n 1)
          "$cli" signer generate --ci -w "$lab/lab.key" > /dev/null
          cp "$lab/lab.key.pub" "$feed/lab.key.pub"
          for version in 0.0.1 0.0.2 0.0.3; do
            set -- --toolchain "$RUST_TOOLCHAIN" --tools "$RUNNER_TEMP/tools" --out "$builds/$version" --lab \
              --update-public-key "$lab/lab.key.pub" --version "$version"
            [ "$version" != 0.0.1 ] || set -- "$@" --test
            scripts/desktop-macos.sh "$@"
            release="$feed/feed/desktop-$version"
            mkdir "$release" "$feed/builds/$version"
            cp "$builds/$version/Yuzuno Lab.app.tar.gz" "$release/yuzuno-desktop-darwin-aarch64.app.tar.gz"
            cp "$builds/$version/build.json" "$feed/builds/$version/build.json"
            env -u TAURI_SIGNING_PRIVATE_KEY -u TAURI_SIGNING_PRIVATE_KEY_PATH TAURI_SIGNING_PRIVATE_KEY_PASSWORD= \
              "$cli" signer sign -f "$lab/lab.key" --app-version "$version" \
              "$release/yuzuno-desktop-darwin-aarch64.app.tar.gz" < /dev/null > /dev/null
          done
          rm -f "$lab/lab.key"
          [ ! -e "$lab/lab.key" ]
          cp "$builds/0.0.1/"*.dmg "$install/"
          (cd "$install" && shasum -a 256 *.dmg > SHA256SUMS)
          (cd "$feed" && find feed builds lab.key.pub -type f | sort | xargs -I{} shasum -a 256 {} > SHA256SUMS)

      # What the lab feed holds, before it is uploaded: the three releases with
      # their two files each, each version's app (unpacked with macOS's tar)
      # being Yuzuno Lab at that version under the lab bundle identifier, with
      # the lab public key in its executable once and a valid ad hoc
      # signature; each signature made by the lab key (not the release key)
      # for that version; the disk image the one build.json names; and no
      # private key anywhere in either artifact.
      - name: Update lab feed (lab only)
        if: github.event_name == 'workflow_dispatch' && inputs.lab
        shell: bash
        run: |
          /usr/bin/python3 - "$RUNNER_TEMP/lab-feed" "$RUNNER_TEMP/lab-install" "$RUNNER_TEMP/lab-check" <<'EOF'
          import base64, hashlib, json, os, plistlib, re, struct, subprocess, sys
          feed, install, check = sys.argv[1:]
          problems = []

          def key_number(raw):
              # "Ed" or "ED", then the key ID as a little-endian 64-bit number.
              return "%016X" % struct.unpack("<Q", raw[2:10])[0]

          def minisign_box(path):
              """The decoded second line of a minisign box as Tauri writes one
              (base64 of the box's text), or None for any other file. A public
              key decodes to 42 bytes and a signature to 74; a secret key to more."""
              try:
                  lines = base64.b64decode(open(path, "rb").read(8192).strip(), validate=True).decode().splitlines()
                  return base64.b64decode(lines[1], validate=True) if lines[0].startswith("untrusted comment:") else None
              except (ValueError, IndexError, UnicodeDecodeError):
                  return None

          pub_line = open(os.path.join(feed, "lab.key.pub")).read().strip()
          lab_id = key_number(base64.b64decode(base64.b64decode(pub_line).decode().splitlines()[1]))
          if lab_id == "E8881810BE226D78":
              problems.append("the lab key is the release key")
          releases = sorted(os.listdir(os.path.join(feed, "feed")))
          versions = ["0.0.1", "0.0.2", "0.0.3"]
          if releases != [f"desktop-{v}" for v in versions]:
              problems.append(f"the feed holds {releases}")
          package = "yuzuno-desktop-darwin-aarch64.app.tar.gz"
          for version in versions:
              release = os.path.join(feed, "feed", f"desktop-{version}")
              if sorted(os.listdir(release)) != [package, package + ".sig"]:
                  problems.append(f"{version}: the release holds {sorted(os.listdir(release))}")
                  continue
              app = json.load(open(os.path.join(feed, "builds", version, "build.json")))["app"]
              expected = {"version": version, "bundleIdentifier": "dev.yuzuno.workspace.lab",
                          "updatePublicKeyId": lab_id, "architectures": ["arm64"]}
              for field, value in expected.items():
                  if app.get(field) != value:
                      problems.append(f"{version}: build.json's {field} is {app.get(field)}, not {value}")
              unpacked = os.path.join(check, version)
              os.makedirs(unpacked)
              subprocess.run(["/usr/bin/tar", "-xzf", os.path.join(release, package), "-C", unpacked], check=True)
              if os.listdir(unpacked) != ["Yuzuno Lab.app"]:
                  problems.append(f"{version}: the update package holds {os.listdir(unpacked)}")
                  continue
              bundle = os.path.join(unpacked, "Yuzuno Lab.app")
              info = plistlib.load(open(os.path.join(bundle, "Contents", "Info.plist"), "rb"))
              if (info.get("CFBundleShortVersionString"), info.get("CFBundleIdentifier")) != (version, "dev.yuzuno.workspace.lab"):
                  problems.append(f"{version}: the app is {info.get('CFBundleIdentifier')} {info.get('CFBundleShortVersionString')}")
              data = open(os.path.join(bundle, "Contents", "MacOS", info["CFBundleExecutable"]), "rb").read()
              if hashlib.sha256(data).hexdigest() != app["executableSha256"]:
                  problems.append(f"{version}: the executable is not build.json's")
              if data.count(pub_line.encode()) != 1:
                  problems.append(f"{version}: the executable holds the lab public key {data.count(pub_line.encode())} times")
              if subprocess.run(["/usr/bin/codesign", "--verify", "--deep", "--strict", bundle]).returncode != 0:
                  problems.append(f"{version}: codesign --verify fails")
              signature = base64.b64decode(open(os.path.join(release, package + ".sig")).read().strip()).decode().splitlines()
              if key_number(base64.b64decode(signature[1])) != lab_id:
                  problems.append(f"{version}: the signature is not by the lab key")
              if not (signature[2].startswith("trusted comment: ") and signature[2].endswith(f"\tversion:{version}")):
                  problems.append(f"{version}: the signature's trusted comment is {signature[2]!r}")
              print(f"{version}: {info.get('CFBundleIdentifier')} {info.get('CFBundleShortVersionString')}, lab key {lab_id}, {signature[2]!r}")
          dmgs = sorted(name for name in os.listdir(install) if name.endswith(".dmg"))
          files = json.load(open(os.path.join(feed, "builds", "0.0.1", "build.json")))["files"]
          if len(dmgs) != 1 or files.get(dmgs[0], {}).get("sha256") != hashlib.sha256(open(os.path.join(install, dmgs[0]), "rb").read()).hexdigest():
              problems.append(f"the install artifact holds {dmgs}, not 0.0.1's disk image")
          for folder in (feed, install):
              for directory, _, names in os.walk(folder):
                  for name in names:
                      raw = minisign_box(os.path.join(directory, name))
                      if name == "lab.key" or (raw is not None and len(raw) not in (42, 74)):
                          problems.append(f"{os.path.join(directory, name)} may be a private key")
          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
          EOF
          {
            echo "### Update lab feed (${{ matrix.arch }})"
            echo
            echo '```'
            cat "$RUNNER_TEMP/lab-install/SHA256SUMS" "$RUNNER_TEMP/lab-feed/SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'workflow_dispatch' && inputs.lab
        with:
          name: yuzuno-macos-${{ matrix.arch }}-lab-install-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lab-install/*.dmg
            ${{ runner.temp }}/lab-install/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'workflow_dispatch' && inputs.lab
        with:
          name: yuzuno-macos-${{ matrix.arch }}-lab-feed-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lab-feed/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
