# Core's build and tests on macOS (YN-108), on the standard GitHub-hosted
# Apple silicon runner (macos-26), as the CI workflow runs them on Linux:
# `cargo build --locked --all-targets` (here in two steps; see Build), then
# .github/scripts/core_tests.py.
# Tests of Linux mechanisms (cgroup, systemd, /proc, pidfd, leases) are
# compiled for Linux only and do not run here; see docs/macos-core.md.
#
# Runs for a pull request or a push to main that changes Core, its runtimes,
# the Cargo files, the test runner or this workflow. Nothing is uploaded; it
# uses no secret, and its token reads contents only. The build's Cargo
# timings are summarized in the job's summary (YN-235).
name: Core macOS

on:
  push:
    branches: [main]
    paths:
      - core/**
      - runtimes/**
      - Cargo.toml
      - Cargo.lock
      - .github/scripts/core_tests.py
      - .github/scripts/cargo_timings.py
      - .github/scripts/hosted-guard.sh
      - .github/scripts/disk-precheck.sh
      - .github/workflows/core-macos.yml
  pull_request:
    branches: [main]
    paths:
      - core/**
      - runtimes/**
      - Cargo.toml
      - Cargo.lock
      - .github/scripts/core_tests.py
      - .github/scripts/cargo_timings.py
      - .github/scripts/hosted-guard.sh
      - .github/scripts/disk-precheck.sh
      - .github/workflows/core-macos.yml

permissions:
  contents: read

# As in CI: a newer push to a PR cancels its older run; every main commit
# gets a run of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The CI workflow's toolchains; bump them together.
  RUST_TOOLCHAIN: 1.97.1
  NODE_VERSION: 22.23.2
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  core:
    name: Core on macOS (build and test)
    # The standard macOS 26 Apple silicon runner, free for public
    # repositories. Not a paid -large or -xlarge one, nor a self-hosted one.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # As in CI: line information for backtraces without full debug data.
      CARGO_PROFILE_DEV_DEBUG: "1"
      CARGO_PROFILE_TEST_DEBUG: "1"
    steps:
      # Before anything else, refuse any runner but a GitHub-hosted one.
      - name: GitHub-hosted runner
        working-directory: .
        run: |
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::not a GitHub-hosted runner"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Runner details
        run: .github/scripts/hosted-guard.sh

      # The label's platform is the one tested: refuse any other.
      - name: Platform
        run: |
          [ "$(uname -s) $(uname -m)" = "Darwin arm64" ] || { echo "::error::this runner is $(uname -s) $(uname -m), not Darwin arm64"; exit 1; }
          sw_vers

      # Only the pinned toolchain, in a RUSTUP_HOME of its own, as in CI.
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          export RUSTUP_HOME="$RUNNER_TEMP/rustup"
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustup toolchain list
          rustc --version && cargo --version

      # The result and Brief tests run the generated validator with Node, as
      # Core does (CI's "Result validator").
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Result validator
        working-directory: web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:result-validator

      # The fake runtimes run through /usr/bin/python3, which the runner's
      # Xcode command line tools provide.
      - name: Show test prerequisites
        run: |
          xcode-select -p
          /usr/bin/python3 --version
          command -v ssh && ssh -V
          node --version

      # Cargo dependencies only; saved only from main, as in CI.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # Read-only check of free disk before building; see the script.
      - name: Disk space precheck
        run: .github/scripts/disk-precheck.sh 20 "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

      # The same targets as `cargo build --all-targets`, in two steps, so
      # Core's library and its unit tests never compile at once (YN-235).
      # Their compilers reach about 6 and 10 GiB (measured on Linux); built
      # together on this runner's 7 GiB, the build spent most of its time
      # compressing and swapping memory (vm_stat). Step 1 builds the library,
      # binaries, examples and integration tests; step 2 finds only the unit
      # tests of the library and binaries left. Both select test targets, so
      # dev-dependency features, and so every unit of step 1, are the same in
      # step 2.
      # --timings writes a report for each step, which the next step
      # summarizes. Moving each away is report-only: a missing one is a
      # warning, and only cargo itself fails this step (and so skips the
      # tests). vm_stat and the swap in use, before, between and after, show
      # in the log whether a step ran short of memory: its page-out, swap-out
      # and compression counters count from the VM's boot.
      - name: Build
        id: build
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          { vm_stat; sysctl vm.swapusage; } || true
          rm -f target/cargo-timings/cargo-timing.html
          cargo build --locked --bins --examples --test '*' --timings
          mv target/cargo-timings/cargo-timing.html "$RUNNER_TEMP/cargo-timing-1.html" \
            || echo "::warning title=Cargo timings::step 1 left no timing report"
          { vm_stat; sysctl vm.swapusage; } || true
          cargo build --locked --all-targets --timings
          mv target/cargo-timings/cargo-timing.html "$RUNNER_TEMP/cargo-timing-2.html" \
            || echo "::warning title=Cargo timings::step 2 left no timing report"
          { vm_stat; sysctl vm.swapusage; } || true

      # Report-only: how long each Cargo unit took, per step, in this job's
      # summary and as one JSON line each in this step's log. The reports are
      # not uploaded; a missing or unreadable one is a warning, never a
      # failure.
      - name: Build timings
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        run: |
          python3 .github/scripts/cargo_timings.py "$RUNNER_TEMP/cargo-timing-1.html" "step 1 of 2: library, binaries, examples, integration tests"
          python3 .github/scripts/cargo_timings.py "$RUNNER_TEMP/cargo-timing-2.html" "step 2 of 2: what --all-targets has left"

      # As in CI: each process runs one test at a time; see the script.
      # - TMPDIR: macOS's own (/var/folders/.../T/) makes the sockets tests
      #   make there longer than macOS's 104-byte limit, which Core rightly
      #   refuses. A new folder of its own under /tmp is short; /tmp is a
      #   symbolic link to /private/tmp, as on every Mac.
      # - YUZUNO_TEST_PYTHON: the Python 3.6 check of the remote helpers
      #   needs a Python older than 3.13 (python_compat_tests.rs); the
      #   command line tools' /usr/bin/python3 is one.
      - name: Test (one test at a time per process)
        env:
          YUZUNO_TEST_PYTHON: /usr/bin/python3
        run: |
          TMPDIR=$(mktemp -d /tmp/ct-XXXXXX)
          export TMPDIR
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          .github/scripts/core_tests.py

      - name: Disk capacity after tests
        if: always()
        run: df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
