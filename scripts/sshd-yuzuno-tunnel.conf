# A port of its own for the Mac desktop app's SSH tunnel to Core, on the Core
# host. Install as /etc/ssh/sshd_config.d/30-yuzuno-tunnel.conf; the steps,
# what was checked and how to undo it are in docs/independent-core.md
# ("Mac desktop app").
#
# On this port only keys in ~/.ssh/authorized_keys_yuzuno_tunnel are accepted
# (not authorized_keys, not an AuthorizedKeysCommand), and they may forward
# local TCP connections to Core's loopback port and nothing else.
#
# Port lines add up: the server keeps listening on the ports other files set.
# If no other file sets one (the server is on its default 22), add "Port 22"
# here too, or it stops listening there.
Port 2223

Match LocalPort 2223
    AuthorizedKeysFile .ssh/authorized_keys_yuzuno_tunnel
    AuthorizedKeysCommand none
    AllowTcpForwarding local
    AllowStreamLocalForwarding no
    PermitOpen 127.0.0.1:4317
    PermitListen none
    GatewayPorts no
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    PermitTunnel no
    PermitUserRC no
    ForceCommand /usr/bin/false
