[package]
name = "yuzuno-desktop"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Yuzuno's native desktop window"

# Keep desktop platform dependencies out of the independently runnable Core.
[workspace]

[features]
# This shell embeds its connection page even under plain `cargo run`.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Lab builds only: opening a link to a reserved `.invalid` host fails, so the
# failure notice can be checked in a real window. Never in a release.
lab-open-failure = []

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
# Official updater: verifies each update's signature before it is installed.
tauri-plugin-updater = "=2.13.3"
# The updater's own HTTP client version, to refuse redirects on it.
updater-http = { package = "reqwest", version = "0.13", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "sync", "time"] }
url = "2.5"
tauri-plugin-opener = "2"
# Verifies a Core release before the connection page installs it in WSL
# (YN-107, local_core/release.rs), as Core verifies one: the versions this
# lock already has through the updater.
minisign-verify = "=0.3.0"
sha2 = "0.10"
# The TLS crypto the updater's HTTP client needs, which the updater plugin
# also installs before building one; release.rs downloads with that client.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# System notifications (T-188): its Rust API only, through notify.rs.
tauri-plugin-notification = "=2.7.0"

[target.'cfg(target_os = "macos")'.dependencies]
# macOS notifications with the user's answer for this app (T-188), through
# UNUserNotificationCenter: its async API only, through notify.rs.
mac-usernotifications = { version = "=0.3.1", default-features = false }
# Asks for the dock badge with alerts and sounds (YN-94, notify.rs): the
# crate above asks for alerts and sounds only. The bindings it already
# uses, at its versions, with only what is called there.
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
block2 = { version = "0.6.2", default-features = false, features = ["std"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "bitflags", "block2", "UNUserNotificationCenter"] }
# Where the system's window buttons end and what a title bar double click
# does (YN-90, title_bar.rs): the AppKit/Foundation bindings Tauri already
# uses, at its versions, with only the classes read there (and NSError,
# which macOS's answer to notify.rs's request carries).
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSGeometry", "NSString", "NSUserDefaults"] }

[target.'cfg(windows)'.dependencies]
# Microsoft's maintained Win32 bindings; keep native caption behavior intact.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Registry"] }
# The taskbar badge (YN-43, badge.rs): ITaskbarList3, a COM interface that
# windows-sys does not bind, from the version Tauri already uses.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# Decodes the badge's approved PNGs (the version Tauri's tooling already uses).
png = "0.18"

[profile.release]
lto = "thin"
strip = true
